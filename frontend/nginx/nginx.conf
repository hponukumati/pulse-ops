# Edge proxy + static SPA. Runs unprivileged on :8080 with a read-only root filesystem.
# Logs contain no URLs, query strings, headers, cookies, bodies or client addresses.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;  # higher levels can include request lines

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Fixed route classes instead of raw paths in logs.
    map $uri $route_class {
        default other;
        /api/v1/ingest/events ingest;
        ~^/api/v1/auth/ auth;
        /graphql graphql;
        ~^/health/ health;
        ~^/assets/ asset;
        / app;
    }
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    log_format safe escape=json '{"ts":"$time_iso8601","event":"proxy.request","request_id":"$request_id",'
                                '"route":"$route_class","method":"$request_method","status":$status,'
                                '"duration_ms":"$request_time","bytes":$body_bytes_sent}';
    access_log /dev/stdout safe;

    # Edge-level limits (anonymous per-address and global). Keys live only in nginx memory.
    limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=50r/s;
    limit_req_zone $server_name zone=global:1m rate=300r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream api { server api:8000; keepalive 16; }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 80k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        limit_conn conn_ip 50;

        error_page 429 = @rate_limited;
        error_page 413 = @too_large;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # replace, never append client-supplied chains
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_buffering on;
        # Proxied API responses carry the API's own no-store/CSP/nosniff headers; the snippet
        # below is applied only to responses nginx generates itself (static files, 413/429).

        location = /api/v1/ingest/events {
            # The API enforces the exact 1,048,576-byte cap with a JSON error; this is the outer guard.
            client_max_body_size 1100k;
            limit_req zone=api_ip burst=100 nodelay;
            limit_req zone=global burst=600 nodelay;
            proxy_pass http://api;
        }

        location /api/v1/auth/ {
            client_max_body_size 16k;
            limit_req zone=auth_ip burst=20 nodelay;
            limit_req zone=global burst=600 nodelay;
            proxy_pass http://api;
        }

        location = /graphql {
            limit_req zone=api_ip burst=100 nodelay;
            limit_req zone=global burst=600 nodelay;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;  # long-lived subscriptions; the API enforces auth/expiry
            proxy_pass http://api;
        }

        location /health/ {
            limit_req zone=global burst=600 nodelay;
            proxy_pass http://api;
        }

        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }

        location @rate_limited {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Retry-After 1 always;
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests"}}';
        }

        location @too_large {
            include /etc/nginx/snippets/security-headers.conf;
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body too large"}}';
        }
    }
}
